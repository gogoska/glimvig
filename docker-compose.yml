services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: glimvig_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: glimvig_db
    volumes:
      - pg_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glimvig_user -d glimvig_db"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    image: glimvig:beta
    env_file:
      - .env
    volumes:
      - static_volume:/site/staticfiles
      - ./local_settings_production.py:/site/glimvig/local_settings.py
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8000:8000'
    expose:
      - "8000"
    command: ["gunicorn", "glimvig.wsgi:application", "--bind", "0.0.0.0:8000"]
    restart: unless-stopped

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/staticfiles
    ports:
      - "80:80"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pg_data:
  static_volume: